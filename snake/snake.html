<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RETRO SNAKE</title>
<link rel="stylesheet" href="arcade.css" />
<style>
  /* On-screen D-pad for touch devices */
  .dpad {
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 6px;
    justify-content: center;
    margin: 16px auto 0;
  }
  .dpad button {
    font-size: 22px;
    color: var(--neon);
    background: rgba(57,255,20,0.06);
    border: 2px solid var(--neon-dim);
    border-radius: 8px;
    font-family: inherit;
  }
  .dpad button:active { background: var(--neon); color: #04120a; }
  .dpad .up    { grid-column: 2; grid-row: 1; }
  .dpad .left  { grid-column: 1; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down  { grid-column: 2; grid-row: 3; }
  @media (hover: none) and (pointer: coarse) {
    .dpad { display: grid; }
  }
</style>
</head>
<body>
  <nav class="arcade-nav">
    <a class="brand" href="index.html">◆ PIXEL ARCADE</a>
    <a class="tab" href="index.html">ARCADE</a>
    <a class="tab active" href="snake.html">SNAKE</a>
    <a class="tab" href="geo.html">GEO GUESS</a>
  </nav>

  <div class="cabinet">
    <h1 class="arcade-title">SNAKE</h1>
    <p class="subtitle">◆ RETRO ARCADE EDITION ◆</p>

    <div class="scoreboard">
      <div><span class="label">SCORE </span><span id="score" class="value">0</span></div>
      <div><span class="label">HI </span><span id="highscore" class="value">0</span></div>
    </div>

    <div class="stage">
      <canvas id="game" class="screen" width="400" height="400" aria-label="Snake game board"></canvas>

      <!-- Start screen -->
      <div id="startScreen" class="overlay">
        <h2>SNAKE</h2>
        <p>EAT &bull; GROW &bull; SURVIVE</p>
        <p class="blink">PRESS <span class="key">SPACE</span> OR TAP START</p>
        <button id="startBtn" class="btn">START</button>
      </div>

      <!-- Pause screen -->
      <div id="pauseScreen" class="overlay hidden">
        <h2>PAUSED</h2>
        <p class="blink">PRESS <span class="key">P</span> TO RESUME</p>
      </div>

      <!-- Game over screen -->
      <div id="overScreen" class="overlay hidden">
        <h2>GAME OVER</h2>
        <p>SCORE</p>
        <p class="big-score" id="finalScore">0</p>
        <p id="newHi" class="hidden" style="color:var(--food);text-shadow:0 0 8px var(--food-glow)">★ NEW HIGH SCORE ★</p>
        <button id="retryBtn" class="btn">PLAY AGAIN</button>
      </div>
    </div>

    <div class="controls">
      MOVE&nbsp; <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
      &nbsp;/&nbsp; <span class="key">▲</span><span class="key">◀</span><span class="key">▼</span><span class="key">▶</span>
      <br />
      <span class="key">SPACE</span> START &nbsp; <span class="key">P</span> PAUSE
    </div>

    <!-- Touch controls -->
    <div class="dpad" aria-hidden="true">
      <button class="up" data-dir="up">▲</button>
      <button class="left" data-dir="left">◀</button>
      <button class="right" data-dir="right">▶</button>
      <button class="down" data-dir="down">▼</button>
    </div>

    <div class="footer-row">
      <span>© PIXEL ARCADE</span>
      <button id="resetHi" class="link-btn">RESET HI-SCORE</button>
    </div>
  </div>

  <script>
  (function () {
    "use strict";

    // ---- Config ----
    const GRID = 20;                 // cells per row / column
    const CELL = 20;                 // pixel size of a cell (canvas is 400x400)
    const START_SPEED = 130;         // ms per step at the start
    const MIN_SPEED = 60;            // fastest step interval
    const SPEED_STEP = 4;            // speed-up per food eaten (ms)
    const POINTS_PER_FOOD = 10;      // points system
    const HI_KEY = "retroSnake.highScore";  // localStorage key

    // ---- Canvas ----
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // ---- DOM ----
    const scoreEl = document.getElementById("score");
    const hiEl = document.getElementById("highscore");
    const startScreen = document.getElementById("startScreen");
    const pauseScreen = document.getElementById("pauseScreen");
    const overScreen = document.getElementById("overScreen");
    const finalScoreEl = document.getElementById("finalScore");
    const newHiEl = document.getElementById("newHi");

    // ---- State ----
    let snake, prevSnake, dir, nextDir, food, score, speed, highScore;
    let running = false, paused = false, loopTimer = null;
    let lastTickAt = 0;              // for smooth between-tick interpolation

    // Load high score from local storage (points persist across sessions)
    highScore = Number(localStorage.getItem(HI_KEY)) || 0;
    hiEl.textContent = highScore;

    function resetGame() {
      snake = [
        { x: 9, y: 10 },
        { x: 8, y: 10 },
        { x: 7, y: 10 }
      ];
      prevSnake = snake.map(s => ({ x: s.x, y: s.y }));
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      speed = START_SPEED;
      scoreEl.textContent = "0";
      placeFood();
    }

    function placeFood() {
      // Find an empty cell for the food
      let cell;
      do {
        cell = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID)
        };
      } while (snake.some(s => s.x === cell.x && s.y === cell.y));
      food = cell;
    }

    function startGame() {
      resetGame();
      running = true;
      paused = false;
      startScreen.classList.add("hidden");
      overScreen.classList.add("hidden");
      pauseScreen.classList.add("hidden");
      lastTickAt = performance.now();
      scheduleTick();
    }

    function scheduleTick() {
      clearTimeout(loopTimer);
      loopTimer = setTimeout(tick, speed);
    }

    function tick() {
      if (!running || paused) return;
      step();
      lastTickAt = performance.now();
      scheduleTick();
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        return gameOver();
      }
      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        return gameOver();
      }

      prevSnake = snake.map(s => ({ x: s.x, y: s.y }));
      snake.unshift(head);

      // Food eaten -> add points, grow, speed up
      if (head.x === food.x && head.y === food.y) {
        score += POINTS_PER_FOOD;
        scoreEl.textContent = score;
        speed = Math.max(MIN_SPEED, speed - SPEED_STEP);
        placeFood();
      } else {
        snake.pop(); // move forward (no growth)
      }
    }

    function gameOver() {
      running = false;
      clearTimeout(loopTimer);

      // Persist high score to local storage
      const isNewHi = score > highScore;
      if (isNewHi) {
        highScore = score;
        localStorage.setItem(HI_KEY, String(highScore));
        hiEl.textContent = highScore;
      }
      finalScoreEl.textContent = score;
      newHiEl.classList.toggle("hidden", !isNewHi);
      overScreen.classList.remove("hidden");
    }

    function togglePause() {
      if (!running) return;
      paused = !paused;
      pauseScreen.classList.toggle("hidden", !paused);
      if (!paused) {
        lastTickAt = performance.now();
        scheduleTick();
      }
    }

    // ---- Rendering ----
    // The snake is drawn as a smooth, tapered body sliding between grid
    // cells (interpolated between ticks), with a proper head and an apple
    // for food — not just squares.

    function render(now) {
      requestAnimationFrame(render);

      // Background
      ctx.fillStyle = "#0b0f0a";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Faint grid
      ctx.strokeStyle = "rgba(57,255,20,0.05)";
      ctx.lineWidth = 1;
      for (let i = 1; i < GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
      }

      drawApple(now);
      drawSnake(now);
    }

    function segmentPoints(now) {
      // Interpolate each segment between its previous and current cell so
      // the body glides instead of jumping cell to cell.
      const t = (running && !paused)
        ? Math.min(1, (now - lastTickAt) / speed)
        : 1;
      const pts = [];
      for (let i = 0; i < snake.length; i++) {
        const cur = snake[i];
        const prev = prevSnake[i] || cur;
        pts.push({
          x: (prev.x + (cur.x - prev.x) * t) * CELL + CELL / 2,
          y: (prev.y + (cur.y - prev.y) * t) * CELL + CELL / 2
        });
      }
      return pts;
    }

    function drawSnake(now) {
      const pts = segmentPoints(now);
      const n = pts.length;
      const headW = 15, tailW = 5;

      // Body: tapered, rounded strokes from tail to head with alternating
      // shades to suggest scales.
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.save();
      ctx.shadowColor = "#1f8a12";
      ctx.shadowBlur = 10;
      for (let i = n - 1; i >= 1; i--) {
        const k = 1 - i / (n - 1);              // 0 at tail -> 1 at head
        ctx.lineWidth = tailW + (headW - tailW) * k;
        ctx.strokeStyle = i % 2 ? "#2ecc0f" : "#39ff14";
        ctx.beginPath();
        ctx.moveTo(pts[i].x, pts[i].y);
        ctx.lineTo(pts[i - 1].x, pts[i - 1].y);
        ctx.stroke();
      }
      ctx.restore();

      // Belly highlight running along the spine
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#c8ffb8";
      ctx.beginPath();
      ctx.moveTo(pts[n - 1].x, pts[n - 1].y);
      for (let i = n - 2; i >= 0; i--) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
      ctx.restore();

      // Head: rounded, slightly wider, facing the travel direction
      const head = pts[0];
      const neck = pts[1] || head;
      let fx = head.x - neck.x, fy = head.y - neck.y;
      const flen = Math.hypot(fx, fy) || 1;
      fx /= flen; fy /= flen;                    // forward unit vector
      const px = -fy, py = fx;                   // perpendicular unit vector

      ctx.save();
      ctx.shadowColor = "#39ff14";
      ctx.shadowBlur = 12;
      ctx.fillStyle = "#4fe82c";
      ctx.beginPath();
      ctx.ellipse(
        head.x + fx * 2, head.y + fy * 2,
        9.5, 8,
        Math.atan2(fy, fx), 0, Math.PI * 2
      );
      ctx.fill();
      ctx.restore();

      // Tongue: flicks out every so often
      if (running && !paused && Math.floor(now / 350) % 3 === 0) {
        const tx = head.x + fx * 11, ty = head.y + fy * 11;
        ctx.strokeStyle = "#ff4560";
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(tx + fx * 6 + px * 3, ty + fy * 6 + py * 3);
        ctx.moveTo(tx, ty);
        ctx.lineTo(tx + fx * 6 - px * 3, ty + fy * 6 - py * 3);
        ctx.stroke();
      }

      // Eyes with pupils, set either side of the head
      for (const side of [-1, 1]) {
        const ex = head.x + fx * 4 + px * 4.5 * side;
        const ey = head.y + fy * 4 + py * 4.5 * side;
        ctx.fillStyle = "#f4fff0";
        ctx.beginPath();
        ctx.arc(ex, ey, 2.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#08140a";
        ctx.beginPath();
        ctx.arc(ex + fx * 1.1, ey + fy * 1.1, 1.3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawApple(now) {
      const cx = food.x * CELL + CELL / 2;
      const cy = food.y * CELL + CELL / 2;
      const pulse = 1 + Math.sin(now / 250) * 0.06;   // gentle pulsing glow
      const r = 7 * pulse;

      // Fruit body
      ctx.save();
      ctx.shadowColor = "#ff5252";
      ctx.shadowBlur = 12;
      const g = ctx.createRadialGradient(cx - 2, cy - 3, 1, cx, cy, r + 2);
      g.addColorStop(0, "#ff8a80");
      g.addColorStop(0.5, "#ff2e2e");
      g.addColorStop(1, "#b71c1c");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy + 1, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Stem
      ctx.strokeStyle = "#8d5524";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy - r + 1);
      ctx.quadraticCurveTo(cx + 2, cy - r - 3, cx + 4, cy - r - 4);
      ctx.stroke();

      // Leaf
      ctx.fillStyle = "#39ff14";
      ctx.beginPath();
      ctx.ellipse(cx - 3, cy - r - 2, 3.5, 1.8, -0.6, 0, Math.PI * 2);
      ctx.fill();

      // Shine
      ctx.fillStyle = "rgba(255,255,255,0.7)";
      ctx.beginPath();
      ctx.arc(cx - 2.5, cy - 2, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // ---- Input ----
    function setDir(nx, ny) {
      // Prevent reversing directly into itself
      if (nx === -dir.x && ny === -dir.y) return;
      nextDir = { x: nx, y: ny };
    }

    const KEYMAP = {
      w: [0, -1], W: [0, -1], ArrowUp: [0, -1],
      s: [0, 1],  S: [0, 1],  ArrowDown: [0, 1],
      a: [-1, 0], A: [-1, 0], ArrowLeft: [-1, 0],
      d: [1, 0],  D: [1, 0],  ArrowRight: [1, 0]
    };

    document.addEventListener("keydown", function (e) {
      if (KEYMAP[e.key]) {
        e.preventDefault();
        if (running && !paused) setDir(KEYMAP[e.key][0], KEYMAP[e.key][1]);
        return;
      }
      if (e.key === " " || e.key === "Spacebar") {
        e.preventDefault();
        if (!running) startGame();
      } else if (e.key === "p" || e.key === "P") {
        togglePause();
      }
    });

    // Touch D-pad
    document.querySelectorAll(".dpad button").forEach(function (b) {
      b.addEventListener("click", function () {
        if (!running) { startGame(); return; }
        const map = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
        const d = map[b.dataset.dir];
        if (d) setDir(d[0], d[1]);
      });
    });

    // Swipe support
    let touchStart = null;
    canvas.addEventListener("touchstart", function (e) {
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });
    canvas.addEventListener("touchend", function (e) {
      if (!touchStart) return;
      const dx = e.changedTouches[0].clientX - touchStart.x;
      const dy = e.changedTouches[0].clientY - touchStart.y;
      if (Math.abs(dx) < 20 && Math.abs(dy) < 20) { if (!running) startGame(); return; }
      if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
      else setDir(0, dy > 0 ? 1 : -1);
      touchStart = null;
    }, { passive: true });

    // Buttons
    document.getElementById("startBtn").addEventListener("click", startGame);
    document.getElementById("retryBtn").addEventListener("click", startGame);
    document.getElementById("resetHi").addEventListener("click", function () {
      localStorage.removeItem(HI_KEY);
      highScore = 0;
      hiEl.textContent = "0";
    });

    // First paint + continuous render loop
    resetGame();
    requestAnimationFrame(render);
  })();
  </script>
</body>
</html>
