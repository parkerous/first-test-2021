<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-label="Blocky Roblox-style volleyball player spiking a ball">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7048e8"/><stop offset="0.55" stop-color="#d6336c"/><stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#ffcc33"/>
    </linearGradient>
    <linearGradient id="ballShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e7e9f0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0d0d10" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="480" height="480" rx="28" fill="url(#sky)"/>
  <!-- court floor -->
  <path d="M0 372 L480 340 L480 480 L0 480 Z" fill="#c9741b" opacity="0.85"/>
  <path d="M0 372 L480 340" stroke="#ffe9a8" stroke-width="4" opacity="0.7"/>
  <!-- net -->
  <g opacity="0.55" stroke="#ffffff" stroke-width="2">
    <line x1="70" y1="96" x2="70" y2="360"/>
    <line x1="40" y1="112" x2="40" y2="360"/>
    <rect x="36" y="104" width="40" height="150" fill="none"/>
    <line x1="36" y1="126" x2="76" y2="120"/><line x1="36" y1="150" x2="76" y2="144"/>
    <line x1="36" y1="174" x2="76" y2="168"/><line x1="36" y1="198" x2="76" y2="192"/>
    <line x1="36" y1="222" x2="76" y2="216"/>
  </g>

  <!-- ===== blocky R6 character (spiking) ===== -->
  <g filter="url(#soft)">
    <!-- back leg -->
    <rect x="214" y="322" width="30" height="86" rx="4" fill="#2b2f36"/>
    <!-- front leg -->
    <rect x="256" y="322" width="30" height="92" rx="4" fill="#3a3f47"/>
    <!-- torso: gold jersey -->
    <rect x="204" y="232" width="96" height="98" rx="8" fill="url(#gold)" stroke="#c6971f" stroke-width="3"/>
    <!-- jersey stripe + number -->
    <rect x="204" y="292" width="96" height="10" fill="#0d0d10" opacity="0.85"/>
    <text x="252" y="284" font-family="Arial Black, Arial, sans-serif" font-size="40" font-weight="900" fill="#0d0d10" text-anchor="middle">7</text>
    <!-- right arm raised to spike -->
    <rect x="300" y="150" width="26" height="96" rx="6" fill="url(#gold)" stroke="#c6971f" stroke-width="3" transform="rotate(18 313 200)"/>
    <!-- left arm balancing -->
    <rect x="178" y="250" width="26" height="86" rx="6" fill="url(#gold)" stroke="#c6971f" stroke-width="3" transform="rotate(-16 191 293)"/>
    <!-- hands -->
    <rect x="322" y="128" width="24" height="24" rx="5" fill="#f3d34a" stroke="#c6971f" stroke-width="2" transform="rotate(18 334 140)"/>
    <rect x="162" y="322" width="24" height="24" rx="5" fill="#f3d34a" stroke="#c6971f" stroke-width="2" transform="rotate(-16 174 334)"/>

    <!-- classic blocky yellow head -->
    <rect x="214" y="150" width="76" height="70" rx="12" fill="#f3d34a" stroke="#d9b52f" stroke-width="3"/>
    <!-- iconic face: two eyes + wide smile -->
    <ellipse cx="238" cy="182" rx="7.5" ry="11" fill="#141414"/>
    <ellipse cx="266" cy="182" rx="7.5" ry="11" fill="#141414"/>
    <path d="M232 198 q20 20 40 0" fill="none" stroke="#141414" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- volleyball above the spiking hand -->
  <g filter="url(#soft)">
    <circle cx="360" cy="104" r="34" fill="url(#ballShade)" stroke="#c8ccd8" stroke-width="2"/>
    <path d="M360 70 a60 60 0 0 1 26 54" fill="none" stroke="#c8ccd8" stroke-width="3"/>
    <path d="M360 70 a60 60 0 0 0 -26 54" fill="none" stroke="#c8ccd8" stroke-width="3"/>
    <path d="M330 96 q30 12 60 0" fill="none" stroke="#c8ccd8" stroke-width="3"/>
    <path d="M334 122 q26 -20 52 0" fill="none" stroke="#c8ccd8" stroke-width="3"/>
  </g>

  <!-- motion lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="406" y1="92" x2="430" y2="86"/>
    <line x1="404" y1="110" x2="432" y2="112"/>
    <line x1="398" y1="128" x2="424" y2="136"/>
  </g>
</svg>
